<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewAPI 自动签到</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
                        radial-gradient(circle at 50% 80%, rgba(167, 139, 250, 0.04) 0%, transparent 50%);
            animation: bgFloat 20s ease-in-out infinite;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(2%, -2%) rotate(1deg); }
            50% { transform: translate(-1%, 3%) rotate(-1deg); }
            75% { transform: translate(3%, -1%) rotate(0.5deg); }
        }

        .container {
            max-width: 620px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5), 0 0 120px rgba(99, 102, 241, 0.1);
            animation: containerFadeIn 1s ease-out;
        }

        @keyframes containerFadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a78bfa 100%);
            color: white;
            padding: 50px 40px 45px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 8s ease-in-out infinite;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(to top, rgba(26, 26, 46, 0.3), transparent);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .header-icon {
            font-size: 56px;
            margin-bottom: 16px;
            display: inline-block;
            animation: iconBounce 3s ease-in-out infinite;
            position: relative;
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            position: relative;
        }

        .header p {
            opacity: 0.95;
            font-size: 17px;
            line-height: 1.5;
            position: relative;
        }

        .content {
            padding: 40px 35px;
            color: rgba(255, 255, 255, 0.85);
        }

        .feature {
            margin-bottom: 28px;
            padding: 24px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: featureFadeIn 0.6s ease-out backwards;
        }

        .feature:nth-child(1) { animation-delay: 0.2s; }
        .feature:nth-child(2) { animation-delay: 0.35s; }

        @keyframes featureFadeIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .feature:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.15);
        }

        .feature h3 {
            color: #a78bfa;
            margin-bottom: 12px;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feature p {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.7;
            font-size: 15px;
        }

        .features-list {
            list-style: none;
            margin-top: 16px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .features-list li {
            padding: 12px 14px;
            color: rgba(255, 255, 255, 0.75);
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .features-list li:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.2);
            transform: translateX(4px);
        }

        .features-list li::before {
            content: '✓';
            color: #34d399;
            font-weight: bold;
            font-size: 13px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 36px;
            animation: btnFadeIn 0.6s ease-out 0.5s backwards;
        }

        @keyframes btnFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            display: block;
            padding: 18px 28px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 14px;
            font-weight: 600;
            font-size: 17px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.35);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(37, 99, 235, 0.45);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #059669 0%, #34d399 100%);
            box-shadow: 0 6px 24px rgba(5, 150, 105, 0.35);
        }

        .btn-secondary:hover {
            box-shadow: 0 10px 40px rgba(5, 150, 105, 0.45);
        }

        .btn-secondary:active {
            transform: translateY(-1px);
        }

        .footer {
            text-align: center;
            padding: 24px 35px;
            background: rgba(255, 255, 255, 0.02);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .footer a {
            color: #a78bfa;
            text-decoration: none;
            transition: color 0.2s;
            position: relative;
        }

        .footer a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: #a78bfa;
            transition: width 0.3s;
        }

        .footer a:hover {
            color: #c4b5fd;
        }

        .footer a:hover::after {
            width: 100%;
        }

        @media (max-width: 480px) {
            body { padding: 12px; }

            .container { border-radius: 16px; }

            .header { padding: 35px 25px 30px; }

            .header-icon { font-size: 42px; }

            .header h1 { font-size: 28px; }

            .header p { font-size: 15px; }

            .content { padding: 25px 20px; }

            .feature { padding: 18px; }

            .features-list { grid-template-columns: 1fr; }

            .btn { padding: 16px 24px; font-size: 16px; }
        }

        /* =======================================================
           液态玻璃主题（Liquid Glass，iOS 26 / macOS Tahoe 风格）
           ======================================================= */

        body {
            background: linear-gradient(160deg, #dbeafe 0%, #e0f2fe 35%, #cffafe 65%, #e0e7ff 100%);
            background-attachment: fixed;
        }

        body::before {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(850px circle at 8% 12%, rgba(14, 165, 233, 0.62) 0%, transparent 60%),
                radial-gradient(950px circle at 92% 6%, rgba(37, 99, 235, 0.55) 0%, transparent 58%),
                radial-gradient(1050px circle at 80% 74%, rgba(6, 182, 212, 0.55) 0%, transparent 62%),
                radial-gradient(800px circle at 12% 82%, rgba(59, 130, 246, 0.48) 0%, transparent 60%),
                radial-gradient(650px circle at 48% 42%, rgba(125, 211, 252, 0.4) 0%, transparent 65%),
                radial-gradient(500px circle at 68% 30%, rgba(45, 212, 191, 0.3) 0%, transparent 62%);
            /* 静态壁纸：动画会导致 backdrop-filter 每帧重算，严重掉帧 */
            animation: none;
        }

        .container {
            background: rgba(255, 255, 255, 0.32);
            backdrop-filter: blur(52px) saturate(200%);
            -webkit-backdrop-filter: blur(52px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow:
                0 24px 70px rgba(15, 23, 42, 0.16),
                0 2px 8px rgba(15, 23, 42, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                inset 0 -1px 0 rgba(255, 255, 255, 0.35);
        }

        .header {
            background: linear-gradient(135deg, rgba(30, 64, 175, 0.68) 0%, rgba(14, 165, 233, 0.55) 100%);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
        }

        .header::after {
            background: linear-gradient(to top, rgba(219, 234, 254, 0.25), transparent);
        }

        .header h1 {
            text-shadow: 0 2px 24px rgba(255, 255, 255, 0.35);
        }

        .content {
            color: #1e293b;
        }

        .feature {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(28px) saturate(170%);
            -webkit-backdrop-filter: blur(28px) saturate(170%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow:
                0 8px 32px rgba(15, 23, 42, 0.07),
                inset 0 1px 0 rgba(255, 255, 255, 1),
                inset 0 2px 6px rgba(255, 255, 255, 0.35),
                inset 0 -1px 0 rgba(255, 255, 255, 0.3);
        }

        .feature:hover {
            background: rgba(255, 255, 255, 0.48);
            border-color: rgba(255, 255, 255, 0.95);
            box-shadow:
                0 14px 44px rgba(37, 99, 235, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 1);
        }

        .feature h3 {
            color: #1e40af;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .feature p {
            color: #334155;
        }

        .features-list li {
            color: #334155;
            background: rgba(255, 255, 255, 0.42);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 999px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .features-list li:hover {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 1);
        }

        .features-list li::before {
            color: #059669;
        }

        .btn {
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.9) 0%, rgba(14, 165, 233, 0.9) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow:
                0 8px 24px rgba(37, 99, 235, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.55),
                inset 0 -1px 0 rgba(255, 255, 255, 0.15);
        }

        .btn:hover {
            box-shadow:
                0 12px 34px rgba(37, 99, 235, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
        }

        .btn-secondary {
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.88) 0%, rgba(16, 185, 129, 0.88) 100%);
            box-shadow:
                0 8px 24px rgba(5, 150, 105, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.55);
        }

        .btn-secondary:hover {
            box-shadow:
                0 12px 34px rgba(5, 150, 105, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
        }

        .footer {
            background: rgba(255, 255, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.6);
            color: #64748b;
        }

        .footer a {
            color: #1e40af;
        }

        .footer a::after {
            background: #2563eb;
        }

        .footer a:hover {
            color: #1d4ed8;
        }

        ::selection {
            background: rgba(37, 99, 235, 0.22);
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(15, 23, 42, 0.18);
            border-radius: 5px;
        }

        /* =======================================================
           深色液态玻璃（Dark Liquid Glass）
           深夜壁纸 + 发光极光色斑 + 深色玻璃层 + 高亮边缘
           ======================================================= */

        html[data-theme="dark"] body {
            background: linear-gradient(170deg, #030814 0%, #061021 40%, #04101f 70%, #020a18 100%);
            background-attachment: fixed;
        }

        html[data-theme="dark"] body::before {
            background:
                radial-gradient(900px circle at 10% 10%, rgba(14, 165, 233, 0.4) 0%, transparent 58%),
                radial-gradient(1000px circle at 92% 8%, rgba(37, 99, 235, 0.38) 0%, transparent 58%),
                radial-gradient(1100px circle at 80% 78%, rgba(6, 182, 212, 0.4) 0%, transparent 62%),
                radial-gradient(850px circle at 12% 85%, rgba(99, 102, 241, 0.3) 0%, transparent 60%),
                radial-gradient(700px circle at 48% 45%, rgba(13, 148, 136, 0.28) 0%, transparent 65%),
                radial-gradient(550px circle at 65% 25%, rgba(56, 189, 248, 0.22) 0%, transparent 60%);
        }

        html[data-theme="dark"] .container {
            background: rgba(8, 16, 34, 0.45);
            backdrop-filter: blur(56px) saturate(190%);
            -webkit-backdrop-filter: blur(56px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.16),
                inset 0 -1px 0 rgba(255, 255, 255, 0.04);
        }

        html[data-theme="dark"] .content {
            color: #cbd5e1;
        }

        html[data-theme="dark"] .header {
            background: linear-gradient(135deg, rgba(30, 64, 175, 0.42) 0%, rgba(8, 145, 178, 0.32) 100%);
            backdrop-filter: blur(32px) saturate(170%);
            -webkit-backdrop-filter: blur(32px) saturate(170%);
        }

        html[data-theme="dark"] .header .header-badge, html[data-theme="dark"] .back-link {
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
        }

        html[data-theme="dark"] .notice {
            background: rgba(37, 99, 235, 0.14);
            border: 1px solid rgba(96, 165, 250, 0.3);
            color: #93c5fd;
        }

        html[data-theme="dark"] .cors-notice {
            background: rgba(245, 158, 11, 0.09);
            border: 1px solid rgba(245, 158, 11, 0.28);
            color: #fcd34d;
        }

        html[data-theme="dark"] .cors-notice a {
            color: #7dd3fc;
        }

        html[data-theme="dark"] .cors-notice a:hover {
            color: #bae6fd;
        }

        html[data-theme="dark"] .cors-proxy-section {
            background: rgba(245, 158, 11, 0.06);
            border: 1px solid rgba(245, 158, 11, 0.22);
        }

        html[data-theme="dark"] .cors-proxy-section .cors-proxy-toggle {
            color: #cbd5e1;
        }

        html[data-theme="dark"] .cors-proxy-section .cors-proxy-warning {
            color: #f87171;
        }

        html[data-theme="dark"] .cors-proxy-picker-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #e2e8f0;
        }

        html[data-theme="dark"] .cors-proxy-picker-btn:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        html[data-theme="dark"] .cors-proxy-custom-name {
            color: #94a3b8;
        }

        html[data-theme="dark"] .site-card, html[data-theme="dark"] .cloud-section, html[data-theme="dark"] .import-section, html[data-theme="dark"] .result-section {
            background: rgba(12, 22, 44, 0.38);
            backdrop-filter: blur(36px) saturate(180%);
            -webkit-backdrop-filter: blur(36px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.14),
                inset 0 2px 8px rgba(255, 255, 255, 0.04),
                inset 0 -1px 0 rgba(255, 255, 255, 0.04);
        }

        html[data-theme="dark"] .site-card:hover {
            border-color: rgba(125, 211, 252, 0.4);
            box-shadow:
                0 16px 50px rgba(14, 165, 233, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.22),
                inset 0 2px 8px rgba(255, 255, 255, 0.05);
        }

        html[data-theme="dark"] .site-card::before {
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(125, 211, 252, 0.1) 0%, transparent 60%);
        }

        html[data-theme="dark"] .site-header {
            background: rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        html[data-theme="dark"] .site-title {
            color: #7dd3fc;
        }

        html[data-theme="dark"] .site-title::before {
            background: linear-gradient(180deg, #38bdf8, #2563eb);
        }

        html[data-theme="dark"] .accounts-divider {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        html[data-theme="dark"] .accounts-label {
            color: #94a3b8;
        }

        html[data-theme="dark"] .form-group label {
            color: #cbd5e1;
            text-shadow: none;
        }

        html[data-theme="dark"] .form-group label .required {
            color: #f87171;
        }

        html[data-theme="dark"] .form-group input {
            background: rgba(4, 10, 24, 0.45);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #f1f5f9;
            box-shadow:
                inset 0 1px 2px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        html[data-theme="dark"] .form-group input::placeholder {
            color: #5b6b84;
        }

        html[data-theme="dark"] .form-group input:hover {
            border-color: rgba(255, 255, 255, 0.28);
            background: rgba(4, 10, 24, 0.55);
        }

        html[data-theme="dark"] .form-group input:focus {
            border-color: rgba(125, 211, 252, 0.75);
            background: rgba(4, 10, 24, 0.6);
            box-shadow:
                0 0 0 4px rgba(56, 189, 248, 0.18),
                0 4px 20px rgba(14, 165, 233, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        html[data-theme="dark"] .form-group small {
            color: #94a3b8;
            text-shadow: none;
        }

        html[data-theme="dark"] .form-group input[id*="acc-access-token"] {
            border-color: rgba(56, 189, 248, 0.45);
            background: rgba(14, 116, 180, 0.14);
        }

        html[data-theme="dark"] .form-group input[id*="acc-access-token"]:hover {
            border-color: rgba(56, 189, 248, 0.7);
            background: rgba(14, 116, 180, 0.22);
        }

        html[data-theme="dark"] .form-group input[id*="acc-access-token"]:focus {
            border-color: rgba(125, 211, 252, 0.85);
            background: rgba(14, 116, 180, 0.26);
            box-shadow:
                0 0 0 4px rgba(56, 189, 248, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        html[data-theme="dark"] .url-jump-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #7dd3fc;
        }

        html[data-theme="dark"] .url-jump-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(125, 211, 252, 0.5);
            color: #bae6fd;
        }

        html[data-theme="dark"] .account-item {
            background: rgba(6, 13, 28, 0.32);
            backdrop-filter: blur(28px) saturate(170%);
            -webkit-backdrop-filter: blur(28px) saturate(170%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                inset 0 2px 5px rgba(255, 255, 255, 0.03),
                0 2px 12px rgba(0, 0, 0, 0.3);
        }

        html[data-theme="dark"] .account-item:hover {
            border-color: rgba(125, 211, 252, 0.38);
            background: rgba(10, 20, 42, 0.42);
        }

        html[data-theme="dark"] .account-item-title {
            color: #7dd3fc;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        html[data-theme="dark"] .btn-primary {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.78) 0%, rgba(14, 165, 233, 0.78) 100%);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow:
                0 8px 28px rgba(14, 165, 233, 0.35),

<script>
    // 主题切换：localStorage 记忆，两个页面共享
    (function () {
        var KEY = 'newapi_theme';
        function apply(t) {
            if (t === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            var b = document.getElementById('themeToggle');
            if (b) { b.textContent = t === 'dark' ? '☀️' : '🌙'; }
        }
        apply(localStorage.getItem(KEY));
        window.toggleTheme = function () {
            var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem(KEY, t);
            apply(t);
        };
    })();
</script>

<script>
        // ===== 3D Card Tilt Effect =====
        const tiltCards = document.querySelectorAll('.feature');
        const tiltBtns = document.querySelectorAll('.btn');

        tiltCards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = (y - centerY) / 20;
                const rotateY = (centerX - x) / 20;
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-2px) scale(1.02)`;
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = '';
            });
        });

        // ===== Magnetic Button Hover =====
        tiltBtns.forEach(btn => {
            btn.addEventListener('mousemove', (e) => {
                const rect = btn.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                btn.style.transform = `translate(${x / 8}px, ${y / 8 - 3}px)`;
                btn.style.boxShadow = `0 ${10 + y / 4}px ${40 + Math.abs(x) / 2}px rgba(37, 99, 235, 0.45)`;
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = '';
                btn.style.boxShadow = '';
            });
        });
    </script>
